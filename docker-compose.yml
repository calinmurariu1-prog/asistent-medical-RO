services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medai_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-asistent_medical}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medai}:${POSTGRES_PASSWORD:-medai_dev_password}@db:5432/${POSTGRES_DB:-asistent_medical}
      S3_ENDPOINT_URL: http://minio:9000
      MED_LLM_URL: http://med-llm:3031
    ports:
      - "8000:8000"

  # Medical LLM micro-service (z-ai CLI wrapper). Used when AI_DEFAULT_PROVIDER=medllm.
  med-llm:
    build: ./med-llm-service
    restart: unless-stopped
    ports:
      - "3031:3031"
    # z.ai credentials mounted read-only from the (git-ignored) root file.
    # The secret stays out of the image and out of git; only the path is here.
    volumes:
      - ./zaiconfig.txt:/app/zaiconfig.txt:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3031/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Baked at build time for the browser bundle; for a real deploy set this
      # as a build arg. At runtime the browser calls the backend directly.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  minio-data:
