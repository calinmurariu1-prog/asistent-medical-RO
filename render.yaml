# Render Blueprint — Asistent Medical AI
# Deploy: push to GitHub, then Render → New → Blueprint → pick this repo.
# Creates: PostgreSQL + backend (FastAPI, Docker) + frontend (Next.js, Docker).
# Cross-service URLs use Render's predictable https://<service-name>.onrender.com.

databases:
  - name: asistent-medical-db
    databaseName: asistent_medical
    user: medai
    plan: free

services:
  # ---- Backend (FastAPI + OCR, runs Alembic migrations on start) ----
  - type: web
    name: asistent-medical-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: asistent-medical-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Offline mock by default; set to anthropic/openai/gemini + key to enable real AI.
      - key: AI_DEFAULT_PROVIDER
        value: mock
      # Allow the frontend origin (predictable Render URL).
      - key: BACKEND_CORS_ORIGINS
        value: https://asistent-medical-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://asistent-medical-frontend.onrender.com

  # ---- Frontend (Next.js) ----
  - type: web
    name: asistent-medical-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    # NEXT_PUBLIC_API_URL is baked at build; the Dockerfile ARG already defaults
    # to the backend service URL above. Override here only if you rename services.
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://asistent-medical-backend.onrender.com
