name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          SECRET_KEY: ci-secret
          DATA_ENCRYPTION_KEY: ci-encryption-key-please-change-00000000
          DATABASE_URL: sqlite://
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Render
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
      HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
    steps:
      - name: Trigger backend deploy
        if: env.HOOK_BACKEND != ''
        run: curl -fsS -X POST "$HOOK_BACKEND"

      - name: Trigger frontend deploy
        if: env.HOOK_FRONTEND != ''
        run: curl -fsS -X POST "$HOOK_FRONTEND"

      - name: No hooks configured
        if: env.HOOK_BACKEND == '' && env.HOOK_FRONTEND == ''
        run: echo "No Render deploy hooks set — skipping. Add RENDER_DEPLOY_HOOK_* secrets to enable."
