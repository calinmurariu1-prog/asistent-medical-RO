name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.8

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          SECRET_KEY: ci-secret
          DATA_ENCRYPTION_KEY: ci-encryption-key-please-change-00000000
          DATABASE_URL: sqlite://
        run: pytest -q

  frontend:
    name: Frontend (build + browser)
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8012
      NEXT_PUBLIC_TEST_MODE: "true"
      NEXT_PUBLIC_SESSION_TRANSPORT: cookie
      E2E_COOKIES: "true"
      BACKEND_URL: http://localhost:8012
      E2E_MAILBOX: /tmp/medical-ro-e2e/mailbox
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and session tests
        run: npm run build && npm run lint && npm run test:unit && npm audit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: |
          pip install -r ../backend/requirements.txt
          npx playwright install --with-deps chromium
      - name: Start isolated local test app
        env:
          SECRET_KEY: ci-local-secret-not-for-production
          DATA_ENCRYPTION_KEY: ci-local-key-not-for-production
          DATABASE_URL: sqlite:////tmp/medical-ro-e2e.db
          LOCAL_DATA_DIR: /tmp/medical-ro-e2e
          STORAGE_BACKEND: local
          AI_DEFAULT_PROVIDER: mock
          RATE_LIMIT_ENABLED: "false" # High-volume browser fixtures; rate limiting has backend tests.
          FRONTEND_URL: http://localhost:3012
          BACKEND_CORS_ORIGINS: http://localhost:3012
        run: |
          (cd ../backend && python -m alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8012 --no-access-log) > /tmp/medical-ro-api.log 2>&1 &
          echo $! > /tmp/medical-ro-api.pid
          node node_modules/next/dist/bin/next start -p 3012 -H 127.0.0.1 > /tmp/medical-ro-web.log 2>&1 &
          echo $! > /tmp/medical-ro-web.pid
          for n in $(seq 1 30); do
            if curl -fsS http://localhost:8012/health && curl -fsS http://localhost:3012/login > /dev/null; then break; fi
            sleep 1
          done
      - name: Browser flows
        run: npm run test:e2e
      - name: Capacitor web export
        run: |
          kill "$(cat /tmp/medical-ro-web.pid)"
          npm run build:mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results

  deploy:
    name: Deploy to Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/new-isolated-project-oheqvr'
    runs-on: ubuntu-latest
    env:
      # Single blueprint sync hook (deploys the whole stack)...
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      # ...or per-service hooks.
      HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
      HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
    steps:
      - name: Trigger blueprint deploy
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK"

      - name: Trigger backend deploy
        if: env.HOOK_BACKEND != ''
        run: curl -fsS -X POST "$HOOK_BACKEND"

      - name: Trigger frontend deploy
        if: env.HOOK_FRONTEND != ''
        run: curl -fsS -X POST "$HOOK_FRONTEND"

      - name: No hooks configured
        if: env.HOOK == '' && env.HOOK_BACKEND == '' && env.HOOK_FRONTEND == ''
        run: echo "No Render deploy hooks set — skipping. Add RENDER_DEPLOY_HOOK (or _BACKEND/_FRONTEND) secrets to enable."
