name: Android APK

# Builds a debug APK you can download from the run's Artifacts.
# Run on demand (Actions → Android APK → Run workflow) or when the mobile
# project changes.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend URL baked into the app"
        required: false
        default: "https://asistent-medical-backend.onrender.com"
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build web assets + Capacitor sync
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://asistent-medical-backend.onrender.com' }}
        run: |
          npm ci
          npm run gen:assets
          npm run mobile:sync

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
