name: Android Release (AAB)

# Builds a SIGNED Android App Bundle (.aab) for Google Play upload.
#
# The upload keystore is committed AES-256 encrypted at
# frontend/android/keystore/upload.jks.gpg and decrypted at build time with
# the KEYSTORE_PASSWORD secret — so no giant base64 secret is needed.
#
# Requires these repository secrets (see docs/LAUNCH_ANDROID.md):
#   KEYSTORE_PASSWORD  - keystore password (also decrypts upload.jks.gpg)
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend URL baked into the app"
        required: false
        default: "https://asistent-medical-backend.onrender.com"
  # Build a release AAB whenever the release workflow itself is touched.
  # (Deliberate trigger — ordinary code pushes do NOT build a release.)
  push:
    paths:
      - ".github/workflows/android-release.yml"

jobs:
  release-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Lengths only — never the values (safe to print).
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_ALIAS         length: ${#KEY_ALIAS}"
          echo "KEY_PASSWORD      length: ${#KEY_PASSWORD}"
          missing=0
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name secret. Add it under Settings → Secrets and variables → Actions → Repository secrets."
              missing=1
            fi
          done
          if [ ! -f frontend/android/keystore/upload.jks.gpg ]; then
            echo "::error::Missing encrypted keystore frontend/android/keystore/upload.jks.gpg"
            missing=1
          fi
          [ "$missing" = "0" ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build web assets + Capacitor sync
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://asistent-medical-backend.onrender.com' }}
        run: |
          npm ci
          npm run mobile:sync

      - name: Decrypt upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$KEYSTORE_PASSWORD" \
              -o "$RUNNER_TEMP/upload.jks" \
              -d frontend/android/keystore/upload.jks.gpg
          echo "Decrypted keystore bytes: $(wc -c < "$RUNNER_TEMP/upload.jks")"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build signed AAB
        working-directory: frontend/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
