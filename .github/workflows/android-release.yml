name: Android Release (AAB)

# Builds a SIGNED Android App Bundle (.aab) for Google Play upload.
# Re-run: 2026-08-16 (secrets confirmed under Repository secrets).
# Requires these repository secrets (see docs/LAUNCH_ANDROID.md):
#   KEYSTORE_BASE64    - base64 of the upload keystore (.jks)
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend URL baked into the app"
        required: false
        default: "https://asistent-medical-backend.onrender.com"
  # Build a release AAB whenever the release workflow itself is touched.
  # (Deliberate trigger — ordinary code pushes do NOT build a release.)
  push:
    paths:
      - ".github/workflows/android-release.yml"

jobs:
  release-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Also read the Variables tab, to detect a "stored as Variable" mistake.
          V_KEYSTORE_BASE64: ${{ vars.KEYSTORE_BASE64 }}
          V_KEYSTORE_PASSWORD: ${{ vars.KEYSTORE_PASSWORD }}
          V_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          V_KEY_PASSWORD: ${{ vars.KEY_PASSWORD }}
        run: |
          # Lengths only — never the values (safe to print).
          echo "== secrets.* =="
          echo "KEYSTORE_BASE64   length: ${#KEYSTORE_BASE64}"
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_ALIAS         length: ${#KEY_ALIAS}"
          echo "KEY_PASSWORD      length: ${#KEY_PASSWORD}"
          echo "== vars.* (should all be 0 if stored correctly as secrets) =="
          echo "KEYSTORE_BASE64   length: ${#V_KEYSTORE_BASE64}"
          echo "KEYSTORE_PASSWORD length: ${#V_KEYSTORE_PASSWORD}"
          echo "KEY_ALIAS         length: ${#V_KEY_ALIAS}"
          echo "KEY_PASSWORD      length: ${#V_KEY_PASSWORD}"
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name secret (empty on runner). Add it under Settings → Secrets and variables → Actions → Repository secrets (the 'Secrets' tab, not 'Variables')."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build web assets + Capacitor sync
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://asistent-medical-backend.onrender.com' }}
        run: |
          npm ci
          npm run mobile:sync

      - name: Decode upload keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build signed AAB
        working-directory: frontend/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
