[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # (str, Enum) mixin kept for broad SQLAlchemy/serialization compatibility
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
